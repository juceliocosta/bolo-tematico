<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Listar Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/listarUsuarios.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<!-- Navbar padrão -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">BoloTematico</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="#" class="nav-link" onclick="baixarRelatorioPDF(event)">Relatório</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="cadastrarBolo.html">Cadastrar Bolo</a></li>
                <li class="nav-item"><a class="nav-link" href="listarBolos.html">Listar Bolos</a></li>
                <li class="nav-item"><a class="nav-link" href="cadastrarUsuario.html">Cadastrar Usuários</a></li>
                <li class="nav-item"><a class="nav-link link-warning">Listar Usuários</a></li>
                <li class="nav-item"><a class="nav-link" href="/auth/logout">Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Conteúdo principal -->
<main class="container py-5">
    <h2 class="text-center mb-4">Lista de Usuários</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover shadow-sm">
            <thead class="table-primary">
            <tr>
                <th>Usuário</th>
                <th>Perfil</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="userBody">
            <!-- Conteúdo gerado dinamicamente pelo controller -->
            </tbody>
        </table>
    </div>
</main>

<footer class="text-center text-muted py-3 mt-auto">
    &copy; 2026 BoloTematico. Todos os direitos reservados.
</footer>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
</script>

<script>
    async  function deleteUser(username){
        if (!confirm('Deseja realmente excluir este usuário?')) return;
        const res = await fetch(`users/delete/${username}`, {method:'DELETE'});
        if (res.ok) {loadUsers()}
    }
    async function loadUsers() {
        try {
            const res = await fetch('users/list');
            const list = await res.json();
            const tbody = document.getElementById('userBody');
            tbody.innerHTML = '';
            list.forEach(u => {
                const row = `<tr>
                    <td>${u.username}</td>
                    <td>${u.role}</td>
                    <td>
                        <button onclick="deleteUser('${u.username}')" class="btn btn-outline-danger">Excluir</button>
                    </td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        } catch (e) {
            console.error(e);
        }
    }
    window.addEventListener('DOMContentLoaded', loadUsers);

    async function baixarRelatorioPDF(event) {
        event.preventDefault();
        try {
            const response = await fetch('/report/pdf');

            if (!response.ok) {
                throw new Error('Erro ao gerar relatório');
            }

            const blob = await response.blob();
            const pdfUrl = URL.createObjectURL(blob);
            window.open(pdfUrl, '_blank');
        } catch (e) {
            console.error(e);
            alert('Não foi possível carregar o relatório PDF.');
        }
    }
</script>
</body>
</html>
