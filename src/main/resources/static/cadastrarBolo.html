<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Bolo</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="stylesheet" href="/css/cadastrarBolo.css">

</head>

<body class="bg-light d-flex flex-column min-vh-100">
<!-- Navbar padrão -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">BoloTematico</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="#" class="nav-link" onclick="baixarRelatorioPDF(event)">Relatório</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link link-warning">Cadastrar Bolo</a></li>
                <li class="nav-item"><a class="nav-link" href="listarBolos.html">Listar Bolos</a></li>
                <li class="nav-item"><a class="nav-link" href="cadastrarUsuario.html">Cadastrar Usuários</a></li>
                <li class="nav-item"><a class="nav-link" href="listarUsuarios.html">Listar Usuários</a></li>
                <li class="nav-item"><a class="nav-link" href="/auth/logout">Sair</a></li>
            </ul>
        </div>
    </div>
</nav>


<!-- Formulário -->
<main class="flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4 cadastrar-bolo-form">
        <h3 class="text-center mb-4">Cadastro de Bolo</h3>
        <form method="POST" id="boloForm">
            <div class="d-flex flex-column flex-md-row justify-content-center gap-3 mt-4">
                <div class="w-100">
                    <div class="mb-3">
                        <label for="tamanho" class="form-label">Tamanho do Bolo</label>
                        <select class="form-select" id="tamanho" name="tamanho" required>
                            <option value="pequeno">Pequeno</option>
                            <option value="medio">Médio</option>
                            <option value="grande">Grande</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="massa" class="form-label">Massa do Bolo</label>
                        <select class="form-select" id="massa" name="massa" required>
                            <option value="chocolate">Chocolate</option>
                            <option value="branca">Branca</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="recheio" class="form-label">Recheio do Bolo</label>
                        <select class="form-select" id="recheio" name="recheio" required>
                            <option value="brigadeiro">Brigadeiro</option>
                            <option value="prestigio">Prestígio</option>                    
                            <option value="ninho">Leite Ninho</option>                    
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="data" class="form-label">Data de Entrega</label>
                        <input type="date" class="form-control" name="data" required>
                    </div>
                </div>
                <div class="w-100">
                    <div class="mb-3">
                        <label for="tema" class="form-label">Tema do Bolo</label>
                        <input type="text" class="form-control" name="tema" required>
                    </div>
                    <div class="mb-3">
                        <label for="aniversariante" class="form-label">Nome do Aniversariante</label>
                        <input type="text" class="form-control" name="aniversariante" required>
                    </div>
                    <div class="mb-3">
                        <label for="idade" class="form-label">Idade do Aniversariante</label>
                        <input type="number" class="form-control" name="idade" required>
                    </div>
                </div>
            </div>
            <div class="d-grid mt-2">
                <button type="submit" class="btn btn-success">Cadastrar Bolo</button>
            </div>
        </form>
    </div>
</main>

<footer class="text-center text-muted py-3 mt-auto">
    &copy; 2026 BoloTematico. Todos os direitos reservados.
</footer>

<script>
    async function onSubmit(e) {
        e.preventDefault();
        const form = e.target;
        const bolo = {
            tamanho: form.tamanho.value,
            massa: form.massa.value,
            recheio: form.recheio.value,
            data: form.data.value,
            tema: form.tema.value,
            aniversariante: form.aniversariante.value,
            idade: parseInt(form.idade.value),
        };
        const res = await fetch('bolos/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bolo)
        });
        if (res.ok) {
            alert('Bolo cadastrado');
            window.location.href = 'listarBolos.html';
        } else {
            alert('Erro ao cadastrar bolo');
        }
    }
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('boloForm').addEventListener('submit', onSubmit);
    });

    async function baixarRelatorioPDF(event) {
        event.preventDefault();
        try {
            const response = await fetch('/report/pdf');

            if (!response.ok) {
                throw new Error('Erro ao gerar relatório');
            }

            const blob = await response.blob();
            const pdfUrl = URL.createObjectURL(blob);
            window.open(pdfUrl, '_blank');
        } catch (e) {
            console.error(e);
            alert('Não foi possível carregar o relatório PDF.');
        }
    }
</script>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
</script>
</body>
</html>
