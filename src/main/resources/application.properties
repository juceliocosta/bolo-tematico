spring.application.name=bolo-tematico
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/bolotematico}
spring.datasource.username=${DB_USERNAME:bolotematico-root}
spring.datasource.password=${DB_PASSWORD:senha-root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# admin padrão no primeiro deploy
app.default-admin.username=${DEFAULT_ADMIN_NAME:admin}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:passadmin}
